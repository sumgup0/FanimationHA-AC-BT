[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "RUF",    # ruff-specific rules
    "S",      # flake8-bandit (security)
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "D203",   # conflicts with D211 — HA uses no-blank-line-before-class
    "D213",   # conflicts with D212 — HA uses summary-on-first-line
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",      # no docstrings required in tests
    "E402",   # imports after sys.modules stubs / skipif markers are intentional
    "S101",   # assert is fine in tests
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
# Foundation for the Platinum `strict-typing` rule. Run locally with:
#   mypy custom_components/fanimation
# A CI mypy job is added once every module — including the in-flux config flow
# and fan platform (parked behind issues #4/#5) — type-checks clean under strict.
# Must track the CI interpreter: Home Assistant's own source now uses 3.14-only
# syntax (PEP 758 parenthesis-free except), which mypy cannot parse when told to
# assume 3.13 — it fails on HA's files before reaching ours.
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = "tests/"

# HA 2026.9 replaced voluptuous with probatio and aliases the `voluptuous` name
# to it in sys.modules at startup, so `import voluptuous as vol` still runs. The
# real voluptuous stays installed as a transitive dependency, though, so mypy
# types our schemas as voluptuous ones while HA's flow helpers now expect
# probatio ones. Importing probatio directly would break HA older than 2026.9,
# so treat the name as untyped instead (measured 2026-11-15 on HA 2026.10.4:
# 6 arg-type errors in config_flow.py without this).
[[tool.mypy.overrides]]
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"

# HA 2026.10 moved FanEntityFeature, DIRECTION_* and ATTR_BRIGHTNESS into each
# platform's const.py and re-exports them from the package without `__all__`,
# which strict mode rejects. The package-level names are the only import path
# that works across the supported range (fan/const.py does not exist in 2025.8).
[[tool.mypy.overrides]]
module = ["homeassistant.components.fan", "homeassistant.components.light"]
implicit_reexport = true
